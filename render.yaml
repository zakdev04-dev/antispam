services:
  - type: web
    name: anti-spam-bot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ADMINS
        sync: false
      - key: PORT
        value: 10000
